<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Horário Amição</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://www.passandoaregua.com.br/images/noticias/0746186001717605846.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes tremorCiclo {
            0%, 80% {
                transform: translate(0, 0);
            }
            84% {
                transform: translate(4px, 0);   /* Direita */
            }
            88% {
                transform: translate(-4px, 0);  /* Esquerda */
            }
            92% {
                transform: translate(0, -4px);  /* Cima */
            }
            96% {
                transform: translate(0, 4px);   /* Baixo */
            }
            100% {
                transform: translate(0, 0);
            }
        }

        .card-flutuante {
            background-color: #e53935;
            color: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        0 10px 15px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
            
            /* Animação que repete a cada 5 segundos */
            animation: tremorCiclo 5s infinite ease-in-out;
        }

        .card-flutuante:hover {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 
                        0 15px 20px rgba(0, 0, 0, 0.3);
        }

        .card-flutuante h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .jornada-section {
            margin-bottom: 22px;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 15px;
            border-radius: 10px;
        }

        .jornada-section label.titulo-pergunta {
            font-size: 0.95rem;
            font-weight: 600;
            display: block;
            margin-bottom: 10px;
        }

        .radio-options {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .radio-label {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.15);
            padding: 8px 6px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .radio-label:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .input-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 0.95rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-group input {
            padding: 12px 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            outline: none;
            transition: background-color 0.2s, box-shadow 0.2s;
        }

        .input-group input:focus {
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
        }

        .btn-calcular {
            width: 100%;
            padding: 14px;
            background-color: #212121;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-calcular:hover {
            background-color: #000000;
        }

        .btn-calcular:active {
            transform: scale(0.98);
        }

        .resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            font-size: 0.95rem;
            display: none;
            line-height: 1.5;
        }

        .resultado p {
            margin-bottom: 6px;
        }

        .resultado p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="card-flutuante">
        <h1>Calculo de Horário Amiçao.</h1>
        
        <form id="form-horarios">
            <div class="jornada-section">
                <label class="titulo-pergunta">Qual a sua jornada de trabalho?</label>
                <div class="radio-options">
                    <label class="radio-label">
                        <input type="radio" name="jornada" value="08:00" required> 08:00
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="jornada" value="07:50"> 07:00
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="jornada" value="07:15"> 07:15
                    </label>
                </div>
            </div>

            <div class="input-group">
                <label for="entrada">1. Horário de Entrada:</label>
                <input type="time" id="entrada" required>
            </div>

            <div class="input-group">
                <label for="saida-intervalo">2. Horário de Saída (Intervalo):</label>
                <input type="time" id="saida-intervalo" required>
            </div>

            <div class="input-group">
                <label for="volta-intervalo">3. Horário de Entrada (Intervalo):</label>
                <input type="time" id="volta-intervalo" required>
            </div>

            <div class="input-group">
                <label for="saida">4. Horário de Saída:</label>
                <input type="time" id="saida" required>
            </div>

            <button type="button" class="btn-calcular" id="btn-calcular">Realizar Cálculo</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const botao = document.getElementById('btn-calcular');
            
            botao.addEventListener('click', function() {
                const jornadaSelecionada = document.querySelector('input[name="jornada"]:checked');
                const entrada = document.getElementById('entrada').value;
                const saidaIntervalo = document.getElementById('saida-intervalo').value;
                const voltaIntervalo = document.getElementById('volta-intervalo').value;
                const saida = document.getElementById('saida').value;
                const divResultado = document.getElementById('resultado');

                if (!jornadaSelecionada) {
                    alert('Por favor, selecione a sua jornada de trabalho!');
                    return;
                }

                if (!entrada || !saidaIntervalo || !voltaIntervalo || !saida) {
                    alert('Por favor, preencha todos os horários!');
                    return;
                }

                function paraMinutos(horario) {
                    const [horas, minutos] = horario.split(':').map(Number);
                    return horas * 60 + minutos;
                }

                function formatarHoras(minutosTotais) {
                    const h = Math.floor(minutosTotais / 60);
                    const m = minutosTotais % 60;
                    return `${h}h ${m < 10 ? '0' : ''}${m}min`;
                }

                const minEntrada = paraMinutos(entrada);
                const minSaidaIntervalo = paraMinutos(saidaIntervalo);
                const minVoltaIntervalo = paraMinutos(voltaIntervalo);
                const minSaida = paraMinutos(saida);

                const minutosIntervalo = minVoltaIntervalo - minSaidaIntervalo;
                const periodoManha = minSaidaIntervalo - minEntrada;
                const periodoTarde = minSaida - minVoltaIntervalo;
                const totalMinutosTrabalho = periodoManha + periodoTarde;

                if (totalMinutosTrabalho < 0 || minutosIntervalo < 0) {
                    divResultado.style.display = 'block';
                    divResultado.innerHTML = '⚠️ Verifique se os horários informados estão na ordem correta.';
                    return;
                }

                let textoIntervalo = `🕒 Horas do intervalo: ${formatarHoras(minutosIntervalo)}`;
                if (minutosIntervalo > 120) {
                    textoIntervalo += '<br>⚠️ intervalo maior que 2 hrs';
                }

                const [jornadaH, jornadaM] = jornadaSelecionada.value.split(':').map(Number);
                const totalMinutosJornada = jornadaH * 60 + jornadaM;
                
                let textoJornada = '';
                if (totalMinutosTrabalho === totalMinutosJornada) {
                    textoJornada = '✅ Horas batem com a jornada escolhida (Tudo OK!).';
                } else if (totalMinutosTrabalho > totalMinutosJornada) {
                    const diff = totalMinutosTrabalho - totalMinutosJornada;
                    textoJornada = `⚡ Acima da jornada (${formatarHoras(diff)} a mais).`;
                } else {
                    const diff = totalMinutosJornada - totalMinutosTrabalho;
                    textoJornada = `⚠️ Abaixo da jornada (${formatarHoras(diff)} faltando).`;
                }

                divResultado.style.display = 'block';
                divResultado.innerHTML = `
                    <p><b>⏱️ Total Trabalhado:</b> ${formatarHoras(totalMinutosTrabalho)}</p>
                    <p>${textoIntervalo}</p>
                    <p>${textoJornada}</p>
                `;
            });
        });
    </script>

</body>
</html>
